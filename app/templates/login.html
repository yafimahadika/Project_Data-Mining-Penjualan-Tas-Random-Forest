<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - PT INOVASI KREATIF MEDIATAMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="login-avatar" aria-hidden="true">
                <i class="bi bi-person"></i>
            </div>

            <h1 id="loginTitle">Sign In</h1>

            {% if error %}
            <div class="login-alert" role="alert">{{ error }}</div>
            {% endif %}

            <form class="login-form" method="post" novalidate>
                <label class="login-field input-group">
                    <span class="input-group-text field-icon" aria-hidden="true">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <input class="form-control" type="text" name="username" autocomplete="username" placeholder="Username" required>
                </label>

                <label class="login-field input-group">
                    <span class="input-group-text field-icon" aria-hidden="true">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input id="passwordInput" class="form-control" type="password" name="password" autocomplete="current-password" placeholder="Password" required>
                </label>

                <button class="login-button" type="submit">Login</button>

                <div class="login-options">
                    <label class="remember-check form-check">
                        <input class="form-check-input" type="checkbox" name="remember" checked>
                        <span>Remember me!</span>
                    </label>
                    <button class="forgot-button" type="button">Forgot Password?</button>
                </div>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
